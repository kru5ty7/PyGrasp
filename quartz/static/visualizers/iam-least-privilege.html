<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IAM Least Privilege Visualizer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #161618;
    color: #d4d4d4;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem 1rem;
  }
  .wrap { width: 100%; max-width: 560px; }
  h4 {
    font-size: .78rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: #646464;
    margin-bottom: .75rem;
  }
  #diagram { margin-bottom: .75rem; }
  #stat {
    padding: .5rem .75rem;
    background: #393639;
    border-left: 3px solid #7b97aa;
    border-radius: 0 4px 4px 0;
    font-size: .85rem;
    line-height: 1.5;
    min-height: 2.4rem;
    margin-bottom: .75rem;
  }
  #ctrl { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
  button {
    padding: .32rem .72rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: .82rem;
    background: #393639;
    color: #d4d4d4;
    transition: opacity .15s;
  }
  button:disabled { opacity: .3; cursor: default; }
  button:not(:disabled):hover { opacity: .75; }
  #btn-step { background: #284b63; color: #fff; }
  #counter { margin-left: auto; font-size: .72rem; color: #646464; }

  /* Diagram styles */
  .user-header {
    background: #284b63;
    color: #fff;
    font-size: .78rem;
    font-weight: 600;
    padding: .25rem .6rem;
    border-radius: 4px 4px 0 0;
    letter-spacing: .04em;
  }
  .perm-grid {
    border: 1px solid #3a3a3e;
    border-radius: 0 0 6px 6px;
    overflow: hidden;
    margin-bottom: .4rem;
  }
  .perm-row {
    display: flex;
    align-items: center;
    padding: .22rem .5rem;
    border-bottom: 1px solid #2a2a2e;
    font-size: .75rem;
    transition: background .3s;
  }
  .perm-row:last-child { border-bottom: none; }
  .perm-name { flex: 1; }
  .perm-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-left: .4rem;
    transition: background .3s;
  }
  .perm-dot.green { background: #28a745; }
  .perm-dot.red { background: #dc3545; }
  .perm-dot.grey { background: #444; }
  .perm-dot.amber { background: #f0a500; }
  .perm-row.highlight { background: #1a2a3a; }
  .perm-row.denied { background: #3a1a1a; }
  .badge-over {
    background: #3a1a1a;
    color: #dc3545;
    border: 1px solid #dc3545;
    border-radius: 3px;
    font-size: .68rem;
    padding: .1rem .35rem;
    margin-left: .4rem;
    font-weight: 600;
  }
  .badge-ok {
    background: #1a3a22;
    color: #28a745;
    border: 1px solid #28a745;
    border-radius: 3px;
    font-size: .68rem;
    padding: .1rem .35rem;
    margin-left: .4rem;
    font-weight: 600;
  }
  .policy-label {
    font-size: .72rem;
    text-align: center;
    padding: .2rem;
    border-radius: 3px;
    margin-bottom: .3rem;
    font-weight: 600;
  }
  .policy-label.admin { background: #3a1a1a; color: #dc3545; }
  .policy-label.custom { background: #1a3a22; color: #28a745; }
  .policy-label.removed { background: #2a2a2e; color: #666; text-decoration: line-through; }
  .blast-box {
    border: 1px solid #dc3545;
    border-radius: 6px;
    padding: .35rem .6rem;
    font-size: .75rem;
    margin-top: .3rem;
    opacity: 0;
    transition: opacity .3s;
    background: #2a1a1a;
  }
  .blast-box.show { opacity: 1; }
  .blast-box.contained { border-color: #28a745; background: #1a2a1a; }
  .step-label {
    font-size: .68rem;
    color: #646464;
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-bottom: .2rem;
  }
  .remove-x {
    color: #dc3545;
    font-weight: 700;
    margin-right: .3rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <h4>IAM Least Privilege — Permission Evolution</h4>
  <div id="diagram"></div>
  <div id="stat"></div>
  <div id="ctrl">
    <button id="btn-back">Back</button>
    <button id="btn-step">Step</button>
    <button id="btn-reset">Reset</button>
    <span id="counter"></span>
  </div>
</div>
<script>
const ALL_PERMS = [
  'S3:PutObject', 'ECR:Push', 'ECS:UpdateService',
  'EC2:*', 'RDS:*', 'Lambda:*',
  'IAM:*', 'CloudFormation:*', 'Secrets:*', 'SQS:*'
];

const NEEDED = new Set(['S3:PutObject', 'ECR:Push', 'ECS:UpdateService']);

function gridAllGreen(badgeText) {
  return `<div class="perm-grid">${ALL_PERMS.map(p => `
    <div class="perm-row">
      <span class="perm-name">${p}</span>
      <span class="perm-dot green"></span>
    </div>`).join('')}</div>
  <div style="font-size:.7rem;color:#dc3545;text-align:right;margin-top:-.2rem;">${badgeText}</div>`;
}

function gridAudit() {
  return `<div class="perm-grid">${ALL_PERMS.map(p => `
    <div class="perm-row ${NEEDED.has(p) ? 'highlight' : ''}">
      <span class="perm-name">${p}</span>
      ${NEEDED.has(p)
        ? '<span style="font-size:.68rem;color:#007bff;margin-left:.3rem;">used ✓</span>'
        : '<span style="font-size:.68rem;color:#646464;margin-left:.3rem;">never called</span>'}
      <span class="perm-dot ${NEEDED.has(p) ? 'green' : 'grey'}"></span>
    </div>`).join('')}</div>`;
}

function gridRemoved() {
  return `<div class="policy-label removed">AdministratorAccess — REMOVED</div>
  <div class="perm-grid">${ALL_PERMS.map(p => `
    <div class="perm-row ${!NEEDED.has(p) ? 'denied' : ''}">
      <span class="perm-name">${p}</span>
      ${!NEEDED.has(p) ? '<span class="remove-x">✕</span>' : ''}
      <span class="perm-dot ${NEEDED.has(p) ? 'amber' : 'grey'}"></span>
    </div>`).join('')}</div>`;
}

function gridMinimal() {
  return `<div class="policy-label custom">custom-deploy-policy (3 actions)</div>
  <div class="perm-grid">${ALL_PERMS.map(p => `
    <div class="perm-row">
      <span class="perm-name">${p}</span>
      <span class="perm-dot ${NEEDED.has(p) ? 'green' : 'grey'}"></span>
    </div>`).join('')}</div>`;
}

const steps = [
  {
    status: "Initial state: deploy-bot has AdministratorAccess. All 10+ service categories are enabled — the user is over-privileged.",
    render: () => `
      <div class="user-header">IAM User: deploy-bot</div>
      <div class="policy-label admin" style="border-radius:0;">AdministratorAccess (AWS managed)</div>
      ${gridAllGreen('10 / 10 services enabled — OVER-PRIVILEGED')}`
  },
  {
    status: "Audit: CloudTrail analysis reveals deploy-bot only ever calls 3 APIs: S3:PutObject, ECR:Push, ECS:UpdateService.",
    render: () => `
      <div class="user-header">IAM User: deploy-bot — Audit in progress</div>
      <div class="policy-label admin" style="border-radius:0;">AdministratorAccess</div>
      <div class="step-label" style="margin-top:.3rem;padding:0 .5rem;">CloudTrail — last 90 days:</div>
      ${gridAudit()}
      <div style="font-size:.72rem;color:#007bff;text-align:center;margin-top:.2rem;">3 of 10 permission groups actually used</div>`
  },
  {
    status: "Remove AdministratorAccess. The user temporarily has no permissions. Blast radius is now zero — but the deployment pipeline is also broken.",
    render: () => `
      <div class="user-header">IAM User: deploy-bot</div>
      ${gridRemoved()}
      <div style="font-size:.72rem;color:#dc3545;text-align:center;margin-top:.2rem;">No permissions attached — pipeline paused</div>`
  },
  {
    status: "Create custom policy with exactly the 3 required actions, scoped to specific resources (bucket, ECR repo, ECS service).",
    render: () => `
      <div class="user-header">IAM User: deploy-bot</div>
      <div style="background:#1a2a3a;border:1px solid #007bff;border-radius:5px;padding:.3rem .6rem;font-size:.72rem;margin-bottom:.3rem;">
        <div style="color:#007bff;font-weight:600;margin-bottom:.15rem;">Creating: custom-deploy-policy</div>
        <div>s3:PutObject → arn:aws:s3:::app-artifacts/*</div>
        <div>ecr:BatchCheckLayerAvailability, ecr:PutImage → app-repo</div>
        <div>ecs:UpdateService → app-cluster/app-service</div>
      </div>
      ${gridRemoved()}`
  },
  {
    status: "Attach custom policy to deploy-bot. Only 3 rows are green. All other services remain blocked — exactly as required.",
    render: () => `
      <div class="user-header">IAM User: deploy-bot</div>
      ${gridMinimal()}
      <div style="font-size:.72rem;color:#28a745;text-align:center;margin-top:.2rem;">3 / 10 permission groups — minimal, scoped to specific resources</div>`
  },
  {
    status: "Attacker compromises deploy-bot credentials. With the minimal policy, blast radius is contained — only 3 actions possible.",
    render: () => `
      <div class="user-header" style="background:#3a1a1a;border-color:#dc3545;">deploy-bot credentials COMPROMISED</div>
      ${gridMinimal()}
      <div class="blast-box show contained">
        <div style="color:#28a745;font-weight:600;margin-bottom:.1rem;">Blast radius: CONTAINED</div>
        <div>Attacker can only: push to one S3 bucket, push ECR images, update one ECS service</div>
        <div style="color:#646464;margin-top:.1rem;">Cannot touch: IAM, RDS, Lambda, EC2, Secrets — all blocked</div>
      </div>`
  },
  {
    status: "Compare: if AdministratorAccess were still attached, the same compromise would expose every service in the account.",
    render: () => `
      <div class="user-header" style="background:#3a1a1a;">deploy-bot — AdministratorAccess scenario (counterfactual)</div>
      <div class="policy-label admin">AdministratorAccess</div>
      ${gridAllGreen('All services exposed')}
      <div class="blast-box show">
        <div style="color:#dc3545;font-weight:600;margin-bottom:.1rem;">Blast radius: FULL ACCOUNT</div>
        <div>Attacker can: create IAM users, delete RDS, read Secrets, stop EC2, deploy Lambda…</div>
        <div style="color:#f0a500;margin-top:.1rem;font-size:.7rem;">Least privilege is the primary defence against credential compromise.</div>
      </div>`
  }
];

let idx = 0;

function render() {
  document.getElementById('diagram').innerHTML = steps[idx].render();
  document.getElementById('stat').textContent = steps[idx].status;
  document.getElementById('counter').textContent = `Step ${idx + 1} / ${steps.length}`;
  document.getElementById('btn-back').disabled = idx === 0;
  const stepBtn = document.getElementById('btn-step');
  if (idx === steps.length - 1) {
    stepBtn.textContent = 'Done ✓';
    stepBtn.disabled = true;
  } else {
    stepBtn.textContent = 'Step';
    stepBtn.disabled = false;
  }
}

document.getElementById('btn-step').addEventListener('click', () => { if (idx < steps.length - 1) { idx++; render(); } });
document.getElementById('btn-back').addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
document.getElementById('btn-reset').addEventListener('click', () => { idx = 0; render(); });

render();
</script>
</body>
</html>
