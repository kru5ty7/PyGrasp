<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IAM Policies Visualizer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #161618;
    color: #d4d4d4;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem 1rem;
  }
  .wrap { width: 100%; max-width: 560px; }
  h4 {
    font-size: .78rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: #646464;
    margin-bottom: .75rem;
  }
  #diagram { margin-bottom: .75rem; }
  #stat {
    padding: .5rem .75rem;
    background: #393639;
    border-left: 3px solid #7b97aa;
    border-radius: 0 4px 4px 0;
    font-size: .85rem;
    line-height: 1.5;
    min-height: 2.4rem;
    margin-bottom: .75rem;
  }
  #ctrl { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
  button {
    padding: .32rem .72rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: .82rem;
    background: #393639;
    color: #d4d4d4;
    transition: opacity .15s;
  }
  button:disabled { opacity: .3; cursor: default; }
  button:not(:disabled):hover { opacity: .75; }
  #btn-step { background: #284b63; color: #fff; }
  #counter { margin-left: auto; font-size: .72rem; color: #646464; }

  /* Diagram styles */
  .request-box {
    background: #2a2a2e;
    border: 1px solid #007bff;
    border-radius: 6px;
    padding: .4rem .7rem;
    font-size: .8rem;
    margin-bottom: .5rem;
    color: #7ab8e8;
  }
  .layer {
    display: flex;
    align-items: center;
    gap: .5rem;
    background: #2a2a2e;
    border: 1px solid #3a3a3e;
    border-radius: 5px;
    padding: .35rem .6rem;
    margin-bottom: .3rem;
    font-size: .8rem;
    transition: all .3s;
  }
  .layer-name {
    flex: 1;
    font-weight: 600;
    font-size: .75rem;
    color: #9a9a9a;
  }
  .layer-detail {
    font-size: .72rem;
    color: #646464;
    flex: 2;
  }
  .badge {
    font-size: .7rem;
    font-weight: 700;
    padding: .15rem .4rem;
    border-radius: 3px;
    min-width: 52px;
    text-align: center;
  }
  .badge.pass { background: #1a3a22; color: #28a745; border: 1px solid #28a745; }
  .badge.fail { background: #3a1a1a; color: #dc3545; border: 1px solid #dc3545; }
  .badge.pending { background: #2a2a2e; color: #646464; border: 1px solid #555; }
  .badge.checking { background: #1a2a3a; color: #007bff; border: 1px solid #007bff; }
  .result-banner {
    text-align: center;
    padding: .5rem;
    border-radius: 6px;
    font-size: .85rem;
    font-weight: 700;
    margin-top: .4rem;
    letter-spacing: .04em;
  }
  .result-banner.allowed { background: #1a3a22; color: #28a745; border: 1px solid #28a745; }
  .result-banner.denied { background: #3a1a1a; color: #dc3545; border: 1px solid #dc3545; }
  .deny-label {
    font-size: .7rem;
    color: #dc3545;
    text-align: center;
    margin-top: .3rem;
    font-style: italic;
  }
  .layer.active { border-color: #007bff; }
  .layer.passed { border-color: #28a745; }
  .layer.denied-l { border-color: #dc3545; }
</style>
</head>
<body>
<div class="wrap">
  <h4>IAM Policies — Policy Evaluation Logic</h4>
  <div id="diagram"></div>
  <div id="stat"></div>
  <div id="ctrl">
    <button id="btn-back">Back</button>
    <button id="btn-step">Step</button>
    <button id="btn-reset">Reset</button>
    <span id="counter"></span>
  </div>
</div>
<script>
function layerHtml(name, detail, badge, cls) {
  return `<div class="layer ${cls}">
    <div class="layer-name">${name}</div>
    <div class="layer-detail">${detail}</div>
    <span class="badge ${badge}">${badge === 'pending' ? '—' : badge === 'checking' ? '...' : badge === 'pass' ? 'PASS' : 'DENY'}</span>
  </div>`;
}

const steps = [
  {
    status: "Request arrives: Alice calls s3:GetObject on bucket X. Evaluation begins top to bottom through policy layers.",
    render: () => `
      <div class="request-box">Request: Alice → s3:GetObject → bucket-x/data.csv</div>
      ${layerHtml('1. SCPs', 'Organization-level guardrails', 'pending', '')}
      ${layerHtml('2. Permission Boundaries', 'Max permissions for identity', 'pending', '')}
      ${layerHtml('3. Identity Policies', 'Policies attached to Alice', 'pending', '')}
      ${layerHtml('4. Resource Policies', 'Bucket policy on bucket-x', 'pending', '')}
      ${layerHtml('5. Session Policies', 'Temp session constraints', 'pending', '')}`
  },
  {
    status: "SCP check: Organization policy allows S3 actions in this account. SCP does not deny — evaluation continues.",
    render: () => `
      <div class="request-box">Request: Alice → s3:GetObject → bucket-x/data.csv</div>
      ${layerHtml('1. SCPs', 'Organization allows S3', 'pass', 'passed')}
      ${layerHtml('2. Permission Boundaries', 'Max permissions for identity', 'pending', 'active')}
      ${layerHtml('3. Identity Policies', 'Policies attached to Alice', 'pending', '')}
      ${layerHtml('4. Resource Policies', 'Bucket policy on bucket-x', 'pending', '')}
      ${layerHtml('5. Session Policies', 'Temp session constraints', 'pending', '')}`
  },
  {
    status: "Permission Boundary check: Alice's boundary allows S3 operations. Evaluation continues.",
    render: () => `
      <div class="request-box">Request: Alice → s3:GetObject → bucket-x/data.csv</div>
      ${layerHtml('1. SCPs', 'Organization allows S3', 'pass', 'passed')}
      ${layerHtml('2. Permission Boundaries', 'Boundary allows S3', 'pass', 'passed')}
      ${layerHtml('3. Identity Policies', 'Policies attached to Alice', 'pending', 'active')}
      ${layerHtml('4. Resource Policies', 'Bucket policy on bucket-x', 'pending', '')}
      ${layerHtml('5. Session Policies', 'Temp session constraints', 'pending', '')}`
  },
  {
    status: "Identity Policy check: S3ReadOnly is attached to Alice's group. It allows s3:GetObject — PASS.",
    render: () => `
      <div class="request-box">Request: Alice → s3:GetObject → bucket-x/data.csv</div>
      ${layerHtml('1. SCPs', 'Organization allows S3', 'pass', 'passed')}
      ${layerHtml('2. Permission Boundaries', 'Boundary allows S3', 'pass', 'passed')}
      ${layerHtml('3. Identity Policies', 'S3ReadOnly → allows s3:GetObject', 'pass', 'passed')}
      ${layerHtml('4. Resource Policies', 'Bucket policy on bucket-x', 'pending', 'active')}
      ${layerHtml('5. Session Policies', 'Temp session constraints', 'pending', '')}`
  },
  {
    status: "Resource Policy check: bucket-x policy allows Alice's account. All explicit allows found, no denies. Evaluation complete.",
    render: () => `
      <div class="request-box">Request: Alice → s3:GetObject → bucket-x/data.csv</div>
      ${layerHtml('1. SCPs', 'Organization allows S3', 'pass', 'passed')}
      ${layerHtml('2. Permission Boundaries', 'Boundary allows S3', 'pass', 'passed')}
      ${layerHtml('3. Identity Policies', 'S3ReadOnly → allows s3:GetObject', 'pass', 'passed')}
      ${layerHtml('4. Resource Policies', 'Bucket policy allows Alice\'s account', 'pass', 'passed')}
      ${layerHtml('5. Session Policies', 'No session policy — no additional restriction', 'pass', 'passed')}
      <div class="result-banner allowed">REQUEST ALLOWED</div>`
  },
  {
    status: "All checks passed — the request is allowed. No explicit Deny was found in any layer.",
    render: () => `
      <div class="request-box">Request: Alice → s3:GetObject → bucket-x/data.csv</div>
      ${layerHtml('1. SCPs', 'Organization allows S3', 'pass', 'passed')}
      ${layerHtml('2. Permission Boundaries', 'Boundary allows S3', 'pass', 'passed')}
      ${layerHtml('3. Identity Policies', 'S3ReadOnly → allows s3:GetObject', 'pass', 'passed')}
      ${layerHtml('4. Resource Policies', 'Bucket policy allows Alice\'s account', 'pass', 'passed')}
      ${layerHtml('5. Session Policies', 'No additional restriction', 'pass', 'passed')}
      <div class="result-banner allowed">REQUEST ALLOWED</div>`
  },
  {
    status: "Replay with Deny: Identity policy has an explicit Deny for s3:GetObject. Short-circuits immediately — no other layer can override a Deny.",
    render: () => `
      <div class="request-box" style="border-color:#dc3545;color:#e88;">Request: Alice → s3:GetObject → bucket-x/data.csv (replay)</div>
      ${layerHtml('1. SCPs', 'Organization allows S3', 'pass', 'passed')}
      ${layerHtml('2. Permission Boundaries', 'Boundary allows S3', 'pass', 'passed')}
      ${layerHtml('3. Identity Policies', 'Explicit Deny: s3:GetObject', 'fail', 'denied-l')}
      ${layerHtml('4. Resource Policies', 'skipped — deny already found', 'pending', '')}
      ${layerHtml('5. Session Policies', 'skipped — deny already found', 'pending', '')}
      <div class="result-banner denied">REQUEST DENIED</div>
      <div class="deny-label">Explicit Deny always wins — even if all other layers Allow</div>`
  }
];

let idx = 0;

function render() {
  document.getElementById('diagram').innerHTML = steps[idx].render();
  document.getElementById('stat').textContent = steps[idx].status;
  document.getElementById('counter').textContent = `Step ${idx + 1} / ${steps.length}`;
  document.getElementById('btn-back').disabled = idx === 0;
  const stepBtn = document.getElementById('btn-step');
  if (idx === steps.length - 1) {
    stepBtn.textContent = 'Done ✓';
    stepBtn.disabled = true;
  } else {
    stepBtn.textContent = 'Step';
    stepBtn.disabled = false;
  }
}

document.getElementById('btn-step').addEventListener('click', () => { if (idx < steps.length - 1) { idx++; render(); } });
document.getElementById('btn-back').addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
document.getElementById('btn-reset').addEventListener('click', () => { idx = 0; render(); });

render();
</script>
</body>
</html>
