<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lambda Concurrency - Visualizer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #161618;
    color: #d4d4d4;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem 1rem;
  }
  .wrap { width: 100%; max-width: 560px; }
  h4 {
    font-size: .78rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: #646464;
    margin-bottom: .5rem;
  }
  #modes { display: flex; gap: .4rem; margin-bottom: .6rem; flex-wrap: wrap; }
  .mode-btn {
    padding: .28rem .65rem;
    border: 1px solid #393639;
    border-radius: 4px;
    cursor: pointer;
    font-size: .78rem;
    background: #2a2a2e;
    color: #888;
    transition: all .15s;
  }
  .mode-btn.active { background: #2e2810; border-color: #f0a500; color: #f0a500; font-weight: 600; }
  .mode-btn:not(.active):hover { color: #d4d4d4; }
  #diagram { margin-bottom: .75rem; }
  #stat {
    padding: .5rem .75rem;
    background: #393639;
    border-left: 3px solid #7b97aa;
    border-radius: 0 4px 4px 0;
    font-size: .85rem;
    line-height: 1.5;
    min-height: 2.4rem;
    margin-bottom: .75rem;
  }
  #ctrl { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
  button {
    padding: .32rem .72rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: .82rem;
    background: #393639;
    color: #d4d4d4;
    transition: opacity .15s;
  }
  button:disabled { opacity: .3; cursor: default; }
  button:not(:disabled):hover { opacity: .75; }
  #btn-step { background: #284b63; color: #fff; }
  #counter { margin-left: auto; font-size: .72rem; color: #646464; }
</style>
</head>
<body>
<div class="wrap">
  <h4>Lambda Concurrency Model</h4>
  <div id="modes">
    <button class="mode-btn active" data-mode="nolimit">No Limits</button>
    <button class="mode-btn" data-mode="reserved">Reserved Concurrency</button>
    <button class="mode-btn" data-mode="provisioned">Provisioned Concurrency</button>
  </div>
  <div id="diagram"></div>
  <div id="stat"></div>
  <div id="ctrl">
    <button id="btn-back" disabled>&#9664; Back</button>
    <button id="btn-step">Step &#8594;</button>
    <button id="btn-reset">&#8635; Reset</button>
    <span id="counter"></span>
  </div>
</div>
<script>
var C = {
  bg: '#2a2a2e', border: '#393639', header: '#284b63',
  amber: '#f0a500', green: '#28a745', red: '#dc3545',
  blue: '#007bff', text: '#d4d4d4', dim: '#333', panelBg: '#393639'
};

// Each scenario renders a pool of env boxes
// We show up to 20 boxes visually; label counts for larger numbers

var allModes = {
  nolimit: [
    {
      msg: 'No reserved or provisioned concurrency. Function shares the account-wide pool of 1000 concurrent executions. Press Step.',
      envs: [], throttled: 0, limit: 1000, limitLabel: 'Account limit: 1000', showPool: true
    },
    {
      msg: 'Step 1/3: Zero requests — zero execution environments. Lambda is idle, no cost.',
      envs: [], throttled: 0, limit: 1000, limitLabel: 'Account limit: 1000', showPool: true
    },
    {
      msg: 'Step 2/3: Burst — 100 requests arrive simultaneously. Lambda cold-starts 100 new execution environments in parallel.',
      envs: Array.from({length: 20}, function(_, i) { return { type: 'cold', label: i < 10 ? (i+1)+'–'+(i+1) : '' }; }),
      envCount: 100, throttled: 0, limit: 1000, limitLabel: 'Account limit: 1000', showPool: true
    },
    {
      msg: 'Step 3/3: Account limit hit at 1000 concurrent. Additional requests are throttled (HTTP 429) — they receive no execution environment.',
      envs: Array.from({length: 20}, function() { return { type: 'cold' }; }),
      envCount: 1000, throttled: 200, limit: 1000, limitLabel: 'Account limit: 1000 — REACHED', showPool: true
    }
  ],
  reserved: [
    {
      msg: 'Reserved concurrency = 10. This function can use at most 10 concurrent executions — and is guaranteed those 10. Press Step.',
      envs: [], throttled: 0, reserved: 10, showPool: true
    },
    {
      msg: 'Step 1/4: Reserved concurrency configured to 10. 10 slots reserved from the account pool.',
      envs: [], throttled: 0, reserved: 10, showPool: true
    },
    {
      msg: 'Step 2/4: 10 requests arrive — all handled. Each request gets its own execution environment within the reservation.',
      envs: Array.from({length: 10}, function() { return { type: 'cold' }; }),
      throttled: 0, reserved: 10, showPool: true
    },
    {
      msg: 'Step 3/4: 11th request arrives — immediately throttled. Reserved concurrency acts as a hard ceiling.',
      envs: Array.from({length: 10}, function() { return { type: 'cold' }; }),
      throttled: 1, reserved: 10, showPool: true
    },
    {
      msg: 'Step 4/4: Other functions in the account are unaffected. Their 990 slots remain available.',
      envs: Array.from({length: 10}, function() { return { type: 'cold' }; }),
      throttled: 0, reserved: 10, otherFns: true, showPool: true
    }
  ],
  provisioned: [
    {
      msg: 'Provisioned concurrency = 5. Five environments are pre-initialised and always ready — no cold start. Billed per minute idle. Press Step.',
      envs: [], throttled: 0, provisioned: 5, showPool: true
    },
    {
      msg: 'Step 1/5: Provisioned concurrency set to 5. Five environments immediately begin warm-up in the background.',
      envs: Array.from({length: 5}, function() { return { type: 'warming' }; }),
      throttled: 0, provisioned: 5, showPool: true
    },
    {
      msg: 'Step 2/5: All 5 environments are now WARM and ready. Billed continuously at the provisioned concurrency rate.',
      envs: Array.from({length: 5}, function() { return { type: 'warm' }; }),
      throttled: 0, provisioned: 5, showPool: true
    },
    {
      msg: 'Step 3/5: 5 requests arrive — all routed to warm environments instantly. Zero cold start latency.',
      envs: Array.from({length: 5}, function() { return { type: 'active' }; }),
      throttled: 0, provisioned: 5, showPool: true
    },
    {
      msg: 'Step 4/5: 6th request arrives — no warm environments available. Lambda cold-starts a new environment for the overflow.',
      envs: Array.from({length: 5}, function() { return { type: 'active' }; }).concat([{ type: 'cold', overflow: true }]),
      throttled: 0, provisioned: 5, showPool: true
    },
    {
      msg: 'Step 5/5: Cost tradeoff — provisioned environments are billed even when idle. Use Auto Scaling to scale the pool down during low-traffic periods.',
      envs: Array.from({length: 5}, function() { return { type: 'warm' }; }),
      throttled: 0, provisioned: 5, showPool: true, showCost: true
    }
  ]
};

var mode = 'nolimit';
var idx = 0;
function steps() { return allModes[mode]; }

function renderSVG(step) {
  var W = 520, H = 220;
  var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';

  // Pool border
  var px = 10, py = 10, pw = 500, ph = 150;
  out += '<rect x="' + px + '" y="' + py + '" width="' + pw + '" height="' + ph + '" rx="6" fill="#1a1a1c" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>';
  out += '<text x="20" y="22" font-size="8" fill="#444">Execution Environment Pool</text>';

  // Limit / reserved label (top-right)
  var limitLabel = step.limitLabel || (step.reserved ? 'Reserved: ' + step.reserved : step.provisioned ? 'Provisioned: ' + step.provisioned : '');
  if (limitLabel) {
    var limitColor = (step.limitLabel && step.limitLabel.indexOf('REACHED') >= 0) ? C.red : '#888';
    out += '<text x="505" y="22" text-anchor="end" font-size="8" fill="' + limitColor + '">' + limitLabel + '</text>';
  }

  // Draw env boxes in a grid: max 20 visible, 10 per row
  var envs = step.envs || [];
  var envCount = step.envCount || envs.length;
  var showEnvs = envs.slice(0, 20);
  var boxW = 42, boxH = 36, cols = 10, gap = 4;
  var gridLeft = px + 10, gridTop = py + 28;

  showEnvs.forEach(function(env, i) {
    var col = i % cols, row = Math.floor(i / cols);
    var bx = gridLeft + col * (boxW + gap);
    var by = gridTop + row * (boxH + gap);
    var color, label, fill;
    if (env.type === 'warm') {
      color = C.green; fill = '#0e2018'; label = 'WARM';
    } else if (env.type === 'active') {
      color = C.amber; fill = '#2e2810'; label = 'active';
    } else if (env.type === 'warming') {
      color = C.blue; fill = '#0a1a2e'; label = 'init...';
    } else if (env.type === 'cold' && env.overflow) {
      color = C.amber; fill = '#2e2810'; label = 'cold';
    } else {
      color = C.amber; fill = '#2e2810'; label = 'env';
    }
    out += '<rect x="' + bx + '" y="' + by + '" width="' + boxW + '" height="' + boxH + '" rx="3" fill="' + fill + '" stroke="' + color + '" stroke-width="1.5"/>';
    out += '<text x="' + (bx + boxW/2) + '" y="' + (by + boxH/2 + 4) + '" text-anchor="middle" font-size="7.5" fill="' + color + '">' + label + '</text>';
  });

  // If count > 20, show overflow label
  if (envCount > 20) {
    var shown = 20;
    var lastCol = (shown-1) % cols, lastRow = Math.floor((shown-1) / cols);
    var ox = gridLeft + (lastCol + 1) * (boxW + gap);
    var oy = gridTop + lastRow * (boxH + gap);
    if (ox + 60 > px + pw) { ox = gridLeft; oy += boxH + gap; }
    out += '<text x="' + (ox + 4) + '" y="' + (oy + boxH/2 + 4) + '" font-size="9" fill="#888">+' + (envCount - 20) + ' more</text>';
  }

  // Throttled marker
  if (step.throttled && step.throttled > 0) {
    var ty = py + ph + 8;
    out += '<rect x="' + px + '" y="' + ty + '" width="' + (step.throttled > 10 ? 200 : 100) + '" height="22" rx="3" fill="#2e1010" stroke="' + C.red + '" stroke-width="1.5"/>';
    out += '<text x="' + (px + (step.throttled > 10 ? 100 : 50)) + '" y="' + (ty + 14) + '" text-anchor="middle" font-size="8.5" fill="' + C.red + '">' + step.throttled + ' request(s) THROTTLED (429)</text>';
  }

  // Other functions note
  if (step.otherFns) {
    var oty = py + ph + 8;
    out += '<rect x="' + (px + 210) + '" y="' + oty + '" width="290" height="22" rx="3" fill="#0a1a0a" stroke="' + C.green + '" stroke-width="1"/>';
    out += '<text x="' + (px + 355) + '" y="' + (oty + 14) + '" text-anchor="middle" font-size="8" fill="' + C.green + '">Other functions: 990 slots still available</text>';
  }

  // Cost note for provisioned
  if (step.showCost) {
    var cty = py + ph + 8;
    out += '<rect x="' + px + '" y="' + cty + '" width="500" height="22" rx="3" fill="#1a1a0a" stroke="#f0a50055" stroke-width="1"/>';
    out += '<text x="260" y="' + (cty + 14) + '" text-anchor="middle" font-size="8.5" fill="' + C.amber + '">Cost: billed per GB-second even when idle — scale down with Auto Scaling</text>';
  }

  out += '</svg>';
  return out;
}

function render() {
  var st = steps();
  var step = st[idx];
  document.getElementById('diagram').innerHTML = renderSVG(step);
  document.getElementById('stat').textContent = step.msg;
  var isLast = idx >= st.length - 1;
  document.getElementById('btn-step').disabled = isLast;
  document.getElementById('btn-step').textContent = isLast ? 'Done ✓' : 'Step →';
  document.getElementById('btn-back').disabled = idx === 0;
  document.getElementById('counter').textContent = 'Step ' + idx + ' / ' + (st.length - 1);
}

document.querySelectorAll('.mode-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    mode = btn.dataset.mode;
    idx = 0;
    document.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    render();
  });
});

document.getElementById('btn-step').onclick = function() {
  if (idx < steps().length - 1) { idx++; render(); }
};
document.getElementById('btn-back').onclick = function() {
  if (idx > 0) { idx--; render(); }
};
document.getElementById('btn-reset').onclick = function() { idx = 0; render(); };

render();
</script>
</body>
</html>
