<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lambda Overview - Visualizer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #161618;
    color: #d4d4d4;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem 1rem;
  }
  .wrap { width: 100%; max-width: 560px; }
  h4 {
    font-size: .78rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: #646464;
    margin-bottom: .75rem;
  }
  #diagram { margin-bottom: .75rem; }
  #stat {
    padding: .5rem .75rem;
    background: #393639;
    border-left: 3px solid #7b97aa;
    border-radius: 0 4px 4px 0;
    font-size: .85rem;
    line-height: 1.5;
    min-height: 2.4rem;
    margin-bottom: .75rem;
  }
  #ctrl { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
  button {
    padding: .32rem .72rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: .82rem;
    background: #393639;
    color: #d4d4d4;
    transition: opacity .15s;
  }
  button:disabled { opacity: .3; cursor: default; }
  button:not(:disabled):hover { opacity: .75; }
  #btn-step { background: #284b63; color: #fff; }
  #counter { margin-left: auto; font-size: .72rem; color: #646464; }
</style>
</head>
<body>
<div class="wrap">
  <h4>Lambda Execution Model</h4>
  <div id="diagram"></div>
  <div id="stat"></div>
  <div id="ctrl">
    <button id="btn-back" disabled>&#9664; Back</button>
    <button id="btn-step">Step &#8594;</button>
    <button id="btn-reset">&#8635; Reset</button>
    <span id="counter"></span>
  </div>
</div>
<script>
var C = {
  bg: '#2a2a2e', border: '#393639', header: '#284b63',
  amber: '#f0a500', green: '#28a745', red: '#dc3545',
  blue: '#007bff', text: '#d4d4d4', dim: '#333', panelBg: '#393639'
};

// Layout: SVG 520 x 270
// EventSource (top-left), LambdaService (top-center), ExecEnv (center), VPC/Internet (bottom-right)
var L = {
  src:   { x: 10,  y: 20,  w: 110, h: 36 },
  svc:   { x: 200, y: 20,  w: 120, h: 36 },
  env:   { x: 130, y: 100, w: 260, h: 110 },
  vpc:   { x: 380, y: 160, w: 130, h: 36 }
};

// progress bar for timeout demo
// steps[9] shows a progress bar inside env

var steps = [
  {
    msg: 'No invocations. Lambda service is idle — 0 execution environments running. Press Step to begin.',
    hi: {}, arrows: [], envPhase: null, progPct: 0, showProg: false
  },
  {
    msg: 'Step 1/9: A request arrives at the Lambda service (from API Gateway, S3, SQS, etc.).',
    hi: { src: 'active', svc: 'active' },
    arrows: [{ from: 'src', to: 'svc', color: C.amber, label: 'invoke request' }],
    envPhase: null, progPct: 0, showProg: false
  },
  {
    msg: 'Step 2/9: Lambda service provisions a new execution environment — downloads the deployment package and starts the runtime.',
    hi: { svc: 'active', env: 'active' },
    arrows: [{ from: 'svc', to: 'env', color: C.amber, label: 'create environment' }],
    envPhase: 'provision', progPct: 0, showProg: false
  },
  {
    msg: 'Step 3/9: Init phase — module-level code runs (global variables set, DB connections opened, SDK clients created).',
    hi: { env: 'active' },
    arrows: [],
    envPhase: 'init', progPct: 0, showProg: false
  },
  {
    msg: 'Step 4/9: Handler invoked with event + context objects. Your function code executes.',
    hi: { env: 'active' },
    arrows: [],
    envPhase: 'handler', progPct: 0, showProg: false
  },
  {
    msg: 'Step 5/9: Handler returns a response. Lambda service returns it to the original caller.',
    hi: { svc: 'done', env: 'done', src: 'done' },
    arrows: [
      { from: 'env', to: 'svc', color: C.green, label: 'response' },
      { from: 'svc', to: 'src', color: C.green, label: 'result' }
    ],
    envPhase: 'done', progPct: 0, showProg: false
  },
  {
    msg: 'Step 6/9: Environment frozen — waits idle for the next request. Global state (connections, cache) persists in memory.',
    hi: { env: 'active' },
    arrows: [],
    envPhase: 'frozen', progPct: 0, showProg: false
  },
  {
    msg: 'Step 7/9: Second request arrives. Same environment reused (warm invocation) — skips provision and init phases entirely.',
    hi: { src: 'active', svc: 'active', env: 'active' },
    arrows: [
      { from: 'src', to: 'svc', color: C.blue, label: 'invoke (warm)' },
      { from: 'svc', to: 'env', color: C.blue, label: 'reuse env' }
    ],
    envPhase: 'handler', progPct: 0, showProg: false
  },
  {
    msg: 'Step 8/9: Environment destroyed after idle timeout (~15 min with no invocations). Next call triggers a cold start.',
    hi: { env: 'error' },
    arrows: [],
    envPhase: 'destroyed', progPct: 0, showProg: false
  },
  {
    msg: 'Step 9/9: Each invocation has a hard 15-minute execution limit. Functions that exceed it are killed mid-execution.',
    hi: { env: 'active' },
    arrows: [],
    envPhase: 'timeout', progPct: 100, showProg: true
  }
];

var idx = 0;

function nc(key) {
  var n = L[key];
  return { x: n.x + n.w / 2, y: n.y + n.h / 2 };
}

function ep(key, toKey) {
  var c = nc(key), tc = nc(toKey), n = L[key];
  var dx = tc.x - c.x, dy = tc.y - c.y;
  var hw = n.w / 2, hh = n.h / 2;
  var adx = Math.abs(dx), ady = Math.abs(dy);
  if (adx === 0 && ady === 0) return c;
  if (adx * hh > ady * hw) {
    return { x: c.x + (dx > 0 ? hw : -hw), y: c.y + dy * (hw / Math.max(adx, 0.001)) };
  }
  return { x: c.x + dx * (hh / Math.max(ady, 0.001)), y: c.y + (dy > 0 ? hh : -hh) };
}

function hiB(key, hi) {
  var s = hi[key];
  if (s === 'active') return C.amber;
  if (s === 'done')   return C.green;
  if (s === 'error')  return C.red;
  return C.border;
}
function hiF(key, hi) {
  var s = hi[key];
  if (s === 'active') return '#2e2810';
  if (s === 'done')   return '#0e2018';
  if (s === 'error')  return '#2e1010';
  return C.bg;
}
function cname(hex) {
  if (hex === C.amber) return 'amber';
  if (hex === C.green) return 'green';
  if (hex === C.red)   return 'red';
  return 'blue';
}

function renderSVG(step) {
  var hi = step.hi;
  var W = 520, H = 270;
  var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
  ['amber','green','red','blue'].forEach(function(n) {
    var col = C[n];
    out += '<defs><marker id="arr-' + n + '" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">'
         + '<polygon points="0 0,8 3,0 6" fill="' + col + '"/></marker></defs>';
  });

  // Arrows
  step.arrows.forEach(function(a) {
    var p1 = ep(a.from, a.to), p2 = ep(a.to, a.from);
    var mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
    out += '<line x1="' + p1.x + '" y1="' + p1.y + '" x2="' + p2.x + '" y2="' + p2.y
         + '" stroke="' + a.color + '" stroke-width="1.5" marker-end="url(#arr-' + cname(a.color) + ')"/>';
    if (a.label) {
      var lw = a.label.length * 5 + 8;
      out += '<rect x="' + (mx - lw/2) + '" y="' + (my - 8) + '" width="' + lw + '" height="13" rx="3" fill="#161618" opacity="0.9"/>';
      out += '<text x="' + mx + '" y="' + (my + 3) + '" text-anchor="middle" font-size="8.5" fill="' + a.color + '">' + a.label + '</text>';
    }
  });

  // Event Source node
  (function() {
    var n = L.src, bc = hiB('src', hi), bf = hiF('src', hi);
    out += '<rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="4" fill="' + bf + '" stroke="' + bc + '" stroke-width="' + (hi.src ? 2 : 1) + '"/>';
    out += '<rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="14" rx="4" fill="' + C.header + '"/>';
    out += '<rect x="' + n.x + '" y="' + (n.y+10) + '" width="' + n.w + '" height="4" fill="' + C.header + '"/>';
    out += '<text x="' + (n.x + n.w/2) + '" y="' + (n.y + 10) + '" text-anchor="middle" font-size="8" fill="#aaa" font-weight="bold">EVENT SOURCE</text>';
    out += '<text x="' + (n.x + n.w/2) + '" y="' + (n.y + 28) + '" text-anchor="middle" font-size="9" fill="' + C.text + '">API GW / S3 / SQS</text>';
  })();

  // Lambda Service node
  (function() {
    var n = L.svc, bc = hiB('svc', hi), bf = hiF('svc', hi);
    out += '<rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="4" fill="' + bf + '" stroke="' + bc + '" stroke-width="' + (hi.svc ? 2 : 1) + '"/>';
    out += '<rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="14" rx="4" fill="' + C.header + '"/>';
    out += '<rect x="' + n.x + '" y="' + (n.y+10) + '" width="' + n.w + '" height="4" fill="' + C.header + '"/>';
    out += '<text x="' + (n.x + n.w/2) + '" y="' + (n.y + 10) + '" text-anchor="middle" font-size="8" fill="#aaa" font-weight="bold">LAMBDA SERVICE</text>';
    out += '<text x="' + (n.x + n.w/2) + '" y="' + (n.y + 28) + '" text-anchor="middle" font-size="9" fill="' + C.text + '">AWS-managed dispatcher</text>';
  })();

  // VPC / Internet node
  (function() {
    var n = L.vpc, bc = hiB('vpc', hi), bf = hiF('vpc', hi);
    out += '<rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="4" fill="' + bf + '" stroke="' + bc + '" stroke-width="1"/>';
    out += '<text x="' + (n.x + n.w/2) + '" y="' + (n.y + n.h/2 - 4) + '" text-anchor="middle" font-size="8.5" fill="#888">VPC / Internet</text>';
    out += '<text x="' + (n.x + n.w/2) + '" y="' + (n.y + n.h/2 + 9) + '" text-anchor="middle" font-size="8" fill="#666">(outbound calls)</text>';
  })();

  // Execution Environment — large box
  (function() {
    var n = L.env;
    var bc = hiB('env', hi), bf = hiF('env', hi);
    var sw = hi.env ? 2 : 1;
    out += '<rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="6" fill="' + bf + '" stroke="' + bc + '" stroke-width="' + sw + '"/>';
    out += '<rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="18" rx="6" fill="' + C.header + '"/>';
    out += '<rect x="' + n.x + '" y="' + (n.y+14) + '" width="' + n.w + '" height="4" fill="' + C.header + '"/>';
    out += '<text x="' + (n.x + n.w/2) + '" y="' + (n.y + 13) + '" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">EXECUTION ENVIRONMENT</text>';

    var phase = step.envPhase;
    var phaseLabels = [
      { key: 'runtime', label: 'Runtime (Python 3.12)' },
      { key: 'code',    label: 'Your code + /tmp' },
      { key: 'state',   label: 'Global state / connections' }
    ];
    var colW = (n.w - 20) / 3;
    var fy = n.y + 26;
    phaseLabels.forEach(function(p, i) {
      var fx = n.x + 10 + i * (colW + 3);
      var active = (phase === 'provision' && i === 0) ||
                   (phase === 'init' && i === 2) ||
                   (phase === 'handler' && i === 1) ||
                   (phase === 'done' && i <= 2) ||
                   (phase === 'frozen' && i === 2) ||
                   (phase === 'timeout' && i === 1);
      var fbc = active ? C.amber : C.border;
      var fbg = active ? '#2e2810' : C.panelBg;
      out += '<rect x="' + fx + '" y="' + fy + '" width="' + colW + '" height="22" rx="3" fill="' + fbg + '" stroke="' + fbc + '" stroke-width="' + (active ? 1.5 : 1) + '"/>';
      out += '<text x="' + (fx + colW/2) + '" y="' + (fy + 14) + '" text-anchor="middle" font-size="7.5" fill="' + (active ? C.amber : '#888') + '">' + p.label + '</text>';
    });

    // Phase label row
    var phaseText = {
      provision: 'Downloading + starting runtime',
      init: 'Running module-level init code',
      handler: 'handler(event, context) executing',
      done: 'Response returned to service',
      frozen: 'Frozen — waiting for next request',
      destroyed: 'DESTROYED after idle timeout',
      timeout: '15-min limit — execution KILLED at cutoff'
    };
    if (phase && phaseText[phase]) {
      var pcolor = (phase === 'destroyed' || phase === 'timeout') ? C.red : (phase === 'done' ? C.green : C.amber);
      var py = n.y + 60;
      out += '<rect x="' + (n.x + 10) + '" y="' + py + '" width="' + (n.w - 20) + '" height="14" rx="3" fill="#111" opacity="0.85"/>';
      out += '<text x="' + (n.x + n.w/2) + '" y="' + (py + 10) + '" text-anchor="middle" font-size="8.5" fill="' + pcolor + '">' + phaseText[phase] + '</text>';
    }

    // Progress bar for timeout step
    if (step.showProg) {
      var bx = n.x + 10, by = n.y + 82, bw = n.w - 20, bh = 12;
      out += '<rect x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" rx="3" fill="#222"/>';
      var fillW = bw * step.progPct / 100;
      out += '<rect x="' + bx + '" y="' + by + '" width="' + fillW + '" height="' + bh + '" rx="3" fill="' + C.red + '"/>';
      // cutoff marker
      out += '<line x1="' + (bx + bw) + '" y1="' + (by - 2) + '" x2="' + (bx + bw) + '" y2="' + (by + bh + 2) + '" stroke="' + C.red + '" stroke-width="2"/>';
      out += '<text x="' + (bx + bw/2) + '" y="' + (by + bh - 2) + '" text-anchor="middle" font-size="7" fill="#fff">0 min                                  15 min &#x2194; CUTOFF</text>';
    }
  })();

  out += '</svg>';
  return out;
}

function render() {
  var step = steps[idx];
  document.getElementById('diagram').innerHTML = renderSVG(step);
  document.getElementById('stat').textContent = step.msg;
  var isLast = idx >= steps.length - 1;
  document.getElementById('btn-step').disabled = isLast;
  document.getElementById('btn-step').textContent = isLast ? 'Done ✓' : 'Step →';
  document.getElementById('btn-back').disabled = idx === 0;
  document.getElementById('counter').textContent = 'Step ' + idx + ' / ' + (steps.length - 1);
}

document.getElementById('btn-step').onclick = function() { if (idx < steps.length - 1) { idx++; render(); } };
document.getElementById('btn-back').onclick = function() { if (idx > 0) { idx--; render(); } };
document.getElementById('btn-reset').onclick = function() { idx = 0; render(); };
render();
</script>
</body>
</html>
